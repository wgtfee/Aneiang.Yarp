name: cloud-validation

on:
  push:
    branches: [ Develop ]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Gateway
        uses: actions/checkout@v4
        with:
          path: platform/apps/gateway/Aneiang.Yarp
      - name: Checkout Health.Abstractions
        uses: actions/checkout@v4
        with:
          repository: wgtfee/Industrial.Health.Abstractions
          ref: master
          path: platform/apps/Industrial.Health/src/Industrial.Health.Abstractions
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore Gateway Host
        working-directory: platform/apps/gateway/Aneiang.Yarp
        run: dotnet restore src/Industrial.Gateway.Host/Industrial.Gateway.Host.csproj
      - name: Build Gateway Host
        working-directory: platform/apps/gateway/Aneiang.Yarp
        run: dotnet build src/Industrial.Gateway.Host/Industrial.Gateway.Host.csproj --configuration Release --no-restore
      - name: Validate platform route JSON
        working-directory: platform/apps/gateway/Aneiang.Yarp/src/Industrial.Gateway.Host
        run: python3 - <<'PY'
          import json
          for name in ['appsettings.json','appsettings.PlatformCompatibility.json','appsettings.PlatformRoutes.json','appsettings.Centralized.json']:
              with open(name, encoding='utf-8') as f: json.load(f)
          base=json.load(open('appsettings.json',encoding='utf-8'))
          route=base['ReverseProxy']['Routes']['thinggateway-api']
          transforms=route.get('Transforms',[])
          assert {'PathRemovePrefix':'/api/thinggateway'} in transforms
          assert not any(t.get('PathPrefix')=='/api' for t in transforms), transforms
          print('Gateway route contract OK')
          PY
      - name: Publish cloud validation status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({owner: context.repo.owner, repo: context.repo.repo, sha: context.sha, state: passed ? 'success' : 'failure', context: 'cloud-validation', description: passed ? 'Gateway cloud validation passed' : 'Gateway cloud validation failed', target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
