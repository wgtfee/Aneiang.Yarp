name: Gateway Develop Platform Validation

on:
  push:
    branches: [ Develop ]
  pull_request:
    branches: [ Develop ]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  route-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Gateway
        uses: actions/checkout@v4

      - name: Validate centralized route contract
        shell: python
        run: |
          import json
          from pathlib import Path

          root = Path('src/Industrial.Gateway.Host')
          base = json.loads((root / 'appsettings.json').read_text(encoding='utf-8-sig'))
          platform = json.loads((root / 'appsettings.PlatformRoutes.json').read_text(encoding='utf-8-sig'))
          centralized = json.loads((root / 'appsettings.CentralizedRoutes.json').read_text(encoding='utf-8-sig'))
          program = (root / 'Program.cs').read_text(encoding='utf-8-sig')

          routes = platform['ReverseProxy']['Routes']

          mes_mode = routes['mes-security-mode']
          mes_emergency = routes['mes-emergency-validate']
          assert mes_mode['Match']['Path'] == '/api/security/local-user-management'
          assert 'AuthorizationPolicy' not in mes_mode
          assert mes_emergency['Match']['Path'] == '/api/security/emergency/validate'
          assert 'AuthorizationPolicy' not in mes_emergency

          iot_mode = routes['iot-security-mode']
          iot_emergency = routes['iot-emergency-validate']
          assert iot_mode['Match']['Path'] == '/api/iot/security/local-user-management'
          assert iot_mode['ClusterId'] == 'iot'
          assert 'AuthorizationPolicy' not in iot_mode
          assert {'PathRemovePrefix': '/api/iot'} in iot_mode['Transforms']
          assert {'PathPrefix': '/api'} in iot_mode['Transforms']
          assert iot_emergency['Match']['Path'] == '/api/iot/security/emergency/validate'
          assert iot_emergency['ClusterId'] == 'iot'
          assert 'AuthorizationPolicy' not in iot_emergency
          assert {'PathRemovePrefix': '/api/iot'} in iot_emergency['Transforms']
          assert {'PathPrefix': '/api'} in iot_emergency['Transforms']

          base_routes = base['ReverseProxy']['Routes']
          assert base_routes['mes-api-default']['AuthorizationPolicy'] == 'gateway'
          assert base_routes['iot-api']['AuthorizationPolicy'] == 'gateway'
          central_routes = centralized['ReverseProxy']['Routes']
          assert central_routes['mes-auth-login']['AuthorizationPolicy'] == 'gateway'
          assert central_routes['mes-auth-captcha']['AuthorizationPolicy'] == 'gateway'

          assert 'appsettings.PlatformRoutes.json' in program
          assert 'appsettings.CentralizedRoutes.json' in program
          print('Gateway centralized bootstrap route contract OK')

      - name: Publish route-contract status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'ci/gateway-route-contract',
              description: passed ? 'Gateway route contract passed' : 'Gateway route contract failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Gateway
        uses: actions/checkout@v4
        with:
          path: platform/Aneiang.Yarp

      - name: Checkout Health.Abstractions
        uses: actions/checkout@v4
        with:
          repository: wgtfee/Industrial.Health.Abstractions
          ref: master
          path: Industrial.Health/src/Industrial.Health.Abstractions
          token: ${{ secrets.PLATFORM_CI_TOKEN || secrets.GH_PAT || secrets.GITHUB_PAT || secrets.PAT || secrets.REPO_TOKEN || secrets.ACCESS_TOKEN || secrets.PERSONAL_ACCESS_TOKEN || github.token }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore Gateway Host
        working-directory: platform/Aneiang.Yarp
        run: dotnet restore src/Industrial.Gateway.Host/Industrial.Gateway.Host.csproj

      - name: Build Gateway Host
        working-directory: platform/Aneiang.Yarp
        run: dotnet build src/Industrial.Gateway.Host/Industrial.Gateway.Host.csproj --configuration Release --no-restore

      - name: Publish build status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'ci/gateway-build',
              description: passed ? 'Gateway build passed' : 'Gateway build failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
